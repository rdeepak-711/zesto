<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#f97316"/>
  <!-- Cake base -->
  <rect x="7" y="18" width="18" height="8" rx="2" fill="white"/>
  <!-- Cake middle layer -->
  <rect x="9" y="13" width="14" height="6" rx="1.5" fill="#fde68a"/>
  <!-- Frosting on top -->
  <path d="M9 13 Q11.5 10 14 13 Q16.5 10 19 13 Q21.5 10 23 13" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Candle -->
  <rect x="15" y="8" width="2" height="5" rx="1" fill="#fde68a"/>
  <!-- Flame -->
  <ellipse cx="16" cy="7.5" rx="1" ry="1.5" fill="#fb923c"/>
  <!-- Decorative dots on base -->
  <circle cx="11" cy="22" r="1" fill="#f97316"/>
  <circle cx="16" cy="22" r="1" fill="#f97316"/>
  <circle cx="21" cy="22" r="1" fill="#f97316"/>
</svg>
